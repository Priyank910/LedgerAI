name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fill the D1 database id
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          placeholder="00000000-0000-0000-0000-000000000000"
          if grep -q "$placeholder" wrangler.toml; then
            if [ -z "${CLOUDFLARE_D1_DATABASE_ID}" ]; then
              echo "wrangler.toml still has the placeholder database_id."
              echo "Set the CLOUDFLARE_D1_DATABASE_ID repository variable to the id from: npx wrangler d1 create ledger-ai"
              exit 1
            fi
            if ! printf '%s' "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
              echo "CLOUDFLARE_D1_DATABASE_ID should be the UUID printed by wrangler d1 create."
              exit 1
            fi
            sed -i "s/${placeholder}/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.toml
          fi
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx wrangler d1 migrations apply ledger-ai --remote
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set the OpenRouter Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Set the OPENROUTER_API_KEY repository secret. It is written to the Worker with wrangler secret put and is not stored in the repo."
            exit 1
          fi
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
