name: Deploy Worker

on:
  workflow_dispatch:
  push:
    # Path filters are not applied to tag pushes, so a v* tag on this branch
    # deploys before the workflow is on main. GitHub only lists Run workflow
    # for workflow files that exist on the default branch.
    branches: [main]
    tags:
      - "v*"
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fill the D1 database id
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_D1_DATABASE_ID}" ]; then
            if ! printf '%s' "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
              echo "CLOUDFLARE_D1_DATABASE_ID should be a UUID."
              exit 1
            fi
            sed -i -E "s/database_id = \"[0-9a-fA-F-]+\"/database_id = \"${CLOUDFLARE_D1_DATABASE_ID}\"/" wrangler.toml
            echo "Replaced database_id from CLOUDFLARE_D1_DATABASE_ID."
          else
            echo "CLOUDFLARE_D1_DATABASE_ID is unset. Using the database_id in wrangler.toml."
          fi
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx wrangler d1 migrations apply ledger-ai --remote
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set the OpenRouter Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Set the OPENROUTER_API_KEY repository secret. It is written to the Worker with wrangler secret put and is not stored in the repo."
            exit 1
          fi
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
      - name: Set the GitHub releases token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RELEASES_TOKEN: ${{ secrets.GITHUB_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RELEASES_TOKEN}" ]; then
            echo "GITHUB_RELEASES_TOKEN is unset. The Worker will call the public GitHub API, which only works while the repository is public."
            exit 0
          fi
          printf '%s' "$GITHUB_RELEASES_TOKEN" | npx wrangler secret put GITHUB_RELEASES_TOKEN
