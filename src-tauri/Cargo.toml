[package]
name = "ledger-ai"
version = "0.1.0"
description = "Ledger AI shop books for Android and Windows"
authors = ["Ledger AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ledger_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
