name = "ledger-ai"
main = "worker/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Paste the id from `npx wrangler d1 create ledger-ai` over the zeros.
# The deploy workflow replaces this placeholder from CLOUDFLARE_D1_DATABASE_ID.
[[d1_databases]]
binding = "DB"
database_name = "ledger-ai"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Tool calling, and it answers in Hindi and Gujarati. Override in .dev.vars for local wrangler.
OPENROUTER_MODEL = "google/gemini-2.5-flash"
